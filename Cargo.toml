[package]
name = "copilot-wrapper"
version = "0.3.1"
edition = "2024"
description = "Minimal OpenAI-compatible API proxy for GitHub Copilot"

[[bin]]
name = "copilot-wrapper"
path = "src/main.rs"

[lib]
name = "copilot_wrapper"
path = "src/lib.rs"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt", "macros", "signal"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-util = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dirs = "6"
tokio-stream = "0.1"
bytes = "1"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros", "signal", "test-util"] }
wiremock = "0.6"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
hyper = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
